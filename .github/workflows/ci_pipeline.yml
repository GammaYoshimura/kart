name: Godot CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download Godot 4.7.2
        run: |
          curl --fail --location --silent --show-error \
            https://github.com/godotengine/godot-builds/releases/download/4.7.2-stable/Godot_v4.7.2-stable_linux.x86_64.zip \
            --output godot.zip
          unzip -q godot.zip -d .godot-ci
          chmod +x .godot-ci/Godot_v4.7.2-stable_linux.x86_64

      - name: Import and index project
        run: .godot-ci/Godot_v4.7.2-stable_linux.x86_64 --headless --editor --path . --quit

      - name: Audit assets
        run: .godot-ci/Godot_v4.7.2-stable_linux.x86_64 --headless --path . --script res://tools/asset_auditor.gd

      - name: Run unit tests
        run: .godot-ci/Godot_v4.7.2-stable_linux.x86_64 --headless --path . --script res://tests/test_runner.gd
